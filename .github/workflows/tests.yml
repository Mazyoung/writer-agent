name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py src

      # Architecture CI Baseline: deterministic, API-free functional contracts
      # and safety invariants. E07.10 destructive validation belongs in real
      # temporary novel projects, not an expanded implementation-detail suite.
      - name: Run fast regression tests
        run: |
          python -m pytest -q \
            tests/test_chapter_plan.py \
            tests/test_planning_foundation.py \
            tests/test_e06.py::TestReviewDecisionParsing \
            tests/test_e06.py::TestStateManagerParseDecision \
            tests/test_e06.py::TestPromptParserContract \
            tests/test_e06.py::TestFailClosedDecisionContract \
            tests/test_e06.py::TestCharacterStateRoundTrip \
            tests/test_e06.py::TestStateCommitResultPropagation \
            tests/test_e06.py::TestSnapshotFailureFailClosed \
            tests/test_architecture_closure.py \
            tests/test_e07_7.py \
            tests/test_e07_8.py \
            tests/test_e07_9.py \
            tests/test_planning_hierarchy.py
